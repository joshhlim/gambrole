[project]
name = "gambrole-api"
version = "0.1.0"
description = "FastAPI backend for GamBROle: the only write path to taidi_core/mahjong_core rooms"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.9",  # [crypto] pulls in `cryptography`, required for ES256/RS256 (Supabase JWKS)
    "gambrole-core",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
mypy_path = "core"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
