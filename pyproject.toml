[project]
name = "taidi-tracker"
version = "0.1.0"
description = "Big Two (Taidi) score keeper with configurable rules and lifetime analytics"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection relies on `Depends(...)` as an argument
# default — that's the documented, required pattern, not the mutable-default
# bug B008 exists to catch.
"api/app/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecations are shown (not hidden) so upcoming breakages surface, and our
# own modules' deprecations fail the run outright. If a third-party library
# gets noisy, add a targeted "ignore::DeprecationWarning:<module>" here.
filterwarnings = [
    "error::DeprecationWarning:(db|ui|game|taidi|taidi_core|mahjong_core|migrate_legacy_to_events)(\\.|$)",
]
