# Local development only. Supabase is the database once deployed —
# see docs/adr/0002-pure-python-core-integer-cents.md and api/README.md.
name: gambrole

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gambrole
      POSTGRES_PASSWORD: gambrole_dev
      POSTGRES_DB: gambrole
    ports:
      - "5433:5432"
    volumes:
      - gambrole_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gambrole"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  gambrole_pg_data:
