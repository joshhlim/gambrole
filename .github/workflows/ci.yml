name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gambrole
          POSTGRES_PASSWORD: gambrole_dev
          POSTGRES_DB: gambrole
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gambrole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --config-file core/pyproject.toml core/taidi_core
      - run: mypy --config-file core/pyproject.toml core/mahjong_core
      - run: mypy --config-file api/pyproject.toml api/app
      - run: pytest tests -q
      - run: pytest core/tests -q
      - run: pytest api/tests -q
      - name: Alembic migration round-trip
        working-directory: api
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gambrole
          POSTGRES_PASSWORD: gambrole_dev
          POSTGRES_DB: gambrole
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gambrole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Migrate the database
        working-directory: api
        run: alembic upgrade head
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build (also typechecks)
        working-directory: web
        run: npm run build
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
