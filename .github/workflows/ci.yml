name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing here pushes, comments, or publishes.
permissions:
  contents: read

# Render waits for these checks before deploying (render.yaml's
# autoDeployTrigger: checksPass), so a red main means nothing ships.
env:
  # The API refuses to start without an explicit auth mode. CI never talks
  # to Supabase.
  TAIDI_AUTH_MODE: dev
  # Same patch release Render runs (render.yaml's PYTHON_VERSION).
  PYTHON_VERSION: "3.13.14"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gambrole
          POSTGRES_PASSWORD: gambrole_dev
          POSTGRES_DB: gambrole
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gambrole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            api/requirements.lock
      # requirements-dev.txt pulls in api/requirements.lock, the same pins
      # Render's build installs, plus exact versions of the dev tools.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --config-file core/pyproject.toml core/taidi_core
      - run: mypy --config-file core/pyproject.toml core/mahjong_core
      - run: mypy --config-file api/pyproject.toml api/app
      - run: pytest tests -q
      - run: pytest core/tests -q
      # api/tests/conftest.py picks its own gambrole_test database.
      - run: pytest api/tests -q
      - name: Alembic migration round-trip + drift check
        working-directory: api
        env:
          TAIDI_DATABASE_URL: postgresql+asyncpg://gambrole:gambrole_dev@localhost:5433/gambrole
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          # Fails if app/db.py's models have changes no migration captures.
          python -m alembic check

  web:
    runs-on: ubuntu-latest
    env:
      # Used by the migrate step and by the uvicorn Playwright starts.
      TAIDI_DATABASE_URL: postgresql+asyncpg://gambrole:gambrole_dev@localhost:5433/gambrole
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gambrole
          POSTGRES_PASSWORD: gambrole_dev
          POSTGRES_DB: gambrole
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gambrole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            api/requirements.lock
      - run: pip install -r requirements-dev.txt
      - name: Migrate the database
        working-directory: api
        run: python -m alembic upgrade head
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build (also typechecks)
        working-directory: web
        run: npm run build
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
