# Render spins a free web service down after 15 minutes with no inbound
# traffic, and waking it takes ~33 seconds — measured, and long enough that
# the first person to open the app on game night thinks it's broken. This
# pings the health check often enough to keep it awake.
#
# Deliberately NOT 24/7: a free service is capped at 750 instance-hours a
# month, and staying up round the clock burns ~744 of them, leaving no room
# for a second free service (or a redeploy overlap) before Render suspends
# it for the rest of the month. This window covers 15:00-02:00 SGT — evenings,
# when game night actually happens — for roughly 330 hours. Widen the hours
# below if you start playing at other times; the cost is only instance-hours.
#
# GitHub only guarantees scheduled runs are eventually delivered, not that
# they're punctual — they can slip by 10+ minutes under load, which is why
# this fires every 5 minutes rather than every 10. Missing two in a row would
# let the service sleep.
name: Keep API warm

on:
  schedule:
    - cron: "*/5 7-18 * * *" # UTC; 15:00-02:00 SGT
  workflow_dispatch: # so you can wake it by hand before a session

# A slow cold start shouldn't pile up overlapping runs.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health check
        run: |
          # --max-time 90 because a cold start legitimately takes ~33s; the
          # retries cover Render returning 502 while the container boots.
          curl --fail --show-error --silent \
               --retry 3 --retry-delay 10 --retry-all-errors \
               --max-time 90 \
               -o /dev/null -w 'status=%{http_code} time=%{time_total}s\n' \
               https://gambrole-api.onrender.com/healthz
